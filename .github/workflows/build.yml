name: Build and Package 91

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Frontend & Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 设置 Node.js 环境并打包前端
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      # 2. 设置 Go 环境并编译后端
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Backend Binary
        working-directory: ./backend  # 👈 关键点：将工作目录切换到包含 go.mod 的 backend 目录
        run: |
          mkdir -p ../bin
          go build -o ../bin/server .

      # 3. 上传构建产物 (Artifacts)
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 91-release-binaries
          path: |
            bin/
            dist/
